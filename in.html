<!DOCTYPE html>
<html>
<head>
    <title>Birthday Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: pink;
            padding: 50px;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 5px 15px gray;
        }

        h1 {
            color: #ff4081;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        button {
            background: #ff4081;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>🎂 Happy Birthday! 🎉</h1>

        <h2>Dear Friend ❤️</h2>

        <p>
            Wishing you a very Happy Birthday!
            May your day be filled with happiness,
            love and beautiful memories. 🥳
        </p>

        <button onclick="alert('Have an amazing birthday! 🎉🎂❤️')">
            Click for a Surprise 🎁
        </button>

    </div>

</body>
</html>
